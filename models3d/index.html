<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062a38">
<title>Jetstrike 3D</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { --accent: #19e3c8; --glass: rgba(255,255,255,.09); --line: rgba(255,255,255,.2); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: #eafcff; font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body {
    background: linear-gradient(125deg, #052a34, #0b4f5c, #0f3d63, #5a2f12, #0b4f5c, #052a34);
    background-size: 400% 400%; animation: bg 26s ease-in-out infinite;
    user-select: none; -webkit-user-select: none;
  }
  @keyframes bg { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .45; pointer-events: none; transition: background 1s; background: var(--accent); }
  .b1 { width: 46vmax; height: 46vmax; left: -14vmax; top: 6vh; animation: float1 17s ease-in-out infinite; }
  .b2 { width: 34vmax; height: 34vmax; right: -10vmax; bottom: 12vh; background: #ff9b3d; opacity: .28; animation: float2 21s ease-in-out infinite; }
  @keyframes float1 { 50% { transform: translate(8vmax, 6vmax) scale(1.15); } }
  @keyframes float2 { 50% { transform: translate(-7vmax, -5vmax) scale(1.2); } }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  button { font: inherit; color: inherit; border: 0; outline: none; cursor: pointer; }
  .glass {
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%);
    box-shadow: 0 10px 40px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.25);
  }
  header { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 10px; align-items: center; z-index: 5; animation: down .7s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes down { from { transform: translateY(-30px); opacity: 0; } }
  .brand { display: flex; align-items: center; gap: 9px; padding: 6px 14px 6px 7px; border-radius: 18px; font-weight: 800; letter-spacing: .06em; font-size: 13px; }
  .brand img { width: 30px; height: 30px; border-radius: 9px; }
  .tabs { position: relative; display: flex; padding: 4px; border-radius: 18px; margin-left: auto; }
  .tab { position: relative; z-index: 1; background: none; padding: 8px 16px; border-radius: 14px; font-weight: 700; opacity: .65; transition: opacity .25s, color .25s; }
  .tab.on { opacity: 1; color: #04222b; }
  .tabs::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 14px; background: linear-gradient(135deg, var(--accent), #ffd35c); transition: transform .4s cubic-bezier(.3,1.3,.5,1), background .6s; box-shadow: 0 4px 18px color-mix(in srgb, var(--accent) 55%, transparent); }
  .tabs[data-on="heroes"]::before { transform: translateX(100%); }
  .dock { position: fixed; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 5; display: flex; flex-direction: column; gap: 9px; animation: up .8s .1s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes up { from { transform: translateY(60px); opacity: 0; } }
  #info { padding: 14px 16px; border-radius: 22px; border-color: color-mix(in srgb, var(--accent) 55%, white 10%); }
  #info.pop { animation: pop .45s cubic-bezier(.2,1.3,.4,1); }
  @keyframes pop { from { transform: scale(.96); opacity: .4; } }
  #info h2 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  #info p { margin: 4px 0 0; opacity: .85; }
  #info .tag { display: inline-block; margin: 2px 0 4px; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 800; letter-spacing: .12em; color: #04222b; background: var(--accent); }
  .tiles { display: flex; gap: 8px; margin-top: 10px; }
  .tile { flex: 1; padding: 8px 6px; border-radius: 14px; text-align: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .tile b { display: block; font-size: 16px; }
  .tile span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .65; }
  .unlock { font-size: 12px; opacity: .7 !important; }
  .rail { display: flex; gap: 8px; overflow-x: auto; padding: 8px; border-radius: 22px; scrollbar-width: none; align-items: center; }
  .rail::-webkit-scrollbar { display: none; }
  .rail > span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .6; padding: 0 4px; flex: none; }
  .chip { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 15px; background: rgba(255,255,255,.08); border: 1px solid transparent; font-weight: 700; transition: transform .25s cubic-bezier(.3,1.5,.5,1), background .3s, border-color .3s; animation: chipIn .5s both; }
  @keyframes chipIn { from { transform: translateY(14px) scale(.9); opacity: 0; } }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 10px var(--dot); }
  .chip:active { transform: scale(.93); }
  .chip.on { background: rgba(255,255,255,.2); border-color: var(--dot, var(--accent)); transform: translateY(-2px); }
  .chip.sm { padding: 6px 11px; font-size: 12px; border-radius: 12px; }
  .chip.sm.on { border-color: var(--accent); }
  .actions { position: fixed; right: 10px; top: calc(max(10px, env(safe-area-inset-top)) + 62px); z-index: 5; display: flex; flex-direction: column; gap: 8px; animation: right .8s .2s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes right { from { transform: translateX(70px); opacity: 0; } }
  .fab { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; transition: transform .25s cubic-bezier(.3,1.5,.5,1), background .3s; }
  .fab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fab:active { transform: scale(.88); }
  .fab.on { background: color-mix(in srgb, var(--accent) 45%, transparent); }
  [hidden] { display: none !important; }
  @media (min-width: 760px) { .dock { left: auto; width: 420px; right: 18px; } header { left: 18px; right: 18px; } .actions { right: 18px; } }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div id="stage"></div>

<header>
  <div class="brand glass"><img src="icon.svg" alt="">JETSTRIKE 3D</div>
  <div class="tabs glass" data-on="guns">
    <button class="tab on" data-tab="guns">Guns</button>
    <button class="tab" data-tab="heroes">Fighters</button>
  </div>
</header>

<div class="actions">
  <button id="spin" class="fab glass" title="Auto spin" aria-label="Auto spin"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
  <button id="fire" class="fab glass" title="Fire" aria-label="Fire"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button>
  <button id="jet" class="fab glass" title="Jetpack" aria-label="Jetpack" hidden><svg viewBox="0 0 24 24"><path d="M12 2c3 3 4 6 4 9l-4 3-4-3c0-3 1-6 4-9z"/><path d="M9 17c0 2 1 4 3 5 2-1 3-3 3-5"/></svg></button>
  <button id="walk" class="fab glass" title="Walk" aria-label="Walk" hidden><svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M11 22l2-7-3-3 1-5 4 3 3 1M9 12l-3 2"/></svg></button>
  <button id="export" class="fab glass" title="Download GLB" aria-label="Download GLB"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"/></svg></button>
</div>

<div class="dock">
  <div id="info" class="glass"></div>
  <div id="weapons" class="rail glass" hidden></div>
  <div id="chips" class="rail glass"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
