name: Build release APK

on:
  push:
    branches: [main, 3d]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore signing key
        run: base64 -d signing/release.keystore.b64 > app/release.keystore

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong" -A1 build.log | head -60 | sed 's#file:///home/runner/work/Jetstrike/Jetstrike/##' | while IFS= read -r l; do echo "::error::$l"; done

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Jetstrike.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jetstrike-release
          path: Jetstrike.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jetstrike build ${{ github.run_number }}
          files: Jetstrike.apk
